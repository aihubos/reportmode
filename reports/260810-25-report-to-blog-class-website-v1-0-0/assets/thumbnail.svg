  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1110" cy="60" r="255" fill="#3182F6" opacity="0.10"/>
  <circle cx="38" cy="610" r="210" fill="#DFFF6A" opacity="0.22"/>
  <g font-family="Noto Sans CJK KR, NanumGothic, Apple SD Gothic Neo, sans-serif">
