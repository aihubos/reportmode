<!-- COMMENT WIDGET -->
<div style="max-width:720px;margin:40px auto;padding:32px 28px;background:#fff;border:1px solid #e5e8eb;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.04);">
  <h3 style="margin:0 0 6px;font-size:20px;color:#191f28;">💬 댓글</h3>
  <p style="margin:0 0 20px;font-size:14px;color:#8b95a1;">로그인 없이 자유롭게 의견을 남겨주세요.</p>
  <div id="comment-list" style="margin-bottom:20px;max-height:400px;overflow-y:auto;"></div>
  <form id="comment-form" style="display:flex;flex-direction:column;gap:10px;" onsubmit="return submitComment(event)">
    <input id="comment-name" type="text" placeholder="이름 (선택)" style="padding:10px 14px;border:1px solid #e5e8eb;border-radius:10px;font-size:14px;max-width:240px;">
    <textarea id="comment-body" rows="3" placeholder="댓글을 입력하세요..." required style="padding:12px 14px;border:1px solid #e5e8eb;border-radius:10px;font-size:14px;resize:vertical;font-family:inherit;"></textarea>
    <button type="submit" style="align-self:flex-end;padding:10px 24px;background:#3182f6;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">등록</button>
  </form>
</div>
<script>
(function(){
  var PAGE = window.location.pathname.replace(/\//g,'-').replace(/^-|-$/g,'') || 'index';
  var STORAGE_KEY = 'comments-' + PAGE;
    var list = document.getElementById('comment-list');
  
  function saveComments(comments) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
  }
  
  function loadComments() {
    var raw = localStorage.getItem(STORAGE_KEY);
    var comments = raw ? JSON.parse(raw) : [];
    list.innerHTML = comments.length === 0 
      ? '<p style="color:#8b95a1;font-size:13px;text-align:center;padding:20px 0;">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</p>'
      : comments.map(function(c,i){
          var name = c.name || '익명';
          var date = new Date(c.time).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
          return '<div style="padding:14px 0;border-bottom:1px solid #f0f0f0;" data-idx="'+i+'">'
            + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
            + '<div>'
            + '<strong style="font-size:14px;color:#191f28;">' + escapeHtml(name) + '</strong>'
            + '<span style="font-size:12px;color:#b0b8c1;margin-left:8px;">' + date + '</span>'
            + '</div>'
            + '<button onclick="deleteComment('+i+')" style="background:none;border:none;color:#ccc;cursor:pointer;font-size:12px;padding:2px 6px;" title="삭제">✕</button>'
            + '</div>'
            + '<p style="margin:0;font-size:14px;color:#4a5568;line-height:1.5;">' + escapeHtml(c.body) + '</p>'
            + '</div>';
        }).join('');
  }
  
  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  window.deleteComment = function(idx) {
    var savedPw = localStorage.getItem(STORAGE_KEY + '-pw');
    if (!savedPw) {
      savedPw = prompt('관리자 비밀번호를 설정하세요 (댓글 삭제용):');
      if (!savedPw) return;
      localStorage.setItem(STORAGE_KEY + '-pw', savedPw);
      alert('비밀번호가 설정되었습니다. 다시 삭제 버튼을 눌러주세요.');
      return;
    }
    var pw = prompt('삭제 비밀번호를 입력하세요:');
    if (pw !== savedPw) { alert('비밀번호가 틀렸습니다.'); return; }
    if (!confirm('정말 삭제하시겠습니까?')) return;
    var raw = localStorage.getItem(STORAGE_KEY);
    var comments = raw ? JSON.parse(raw) : [];
    comments.splice(idx, 1);
    saveComments(comments);
    loadComments();
  };
  
  window.submitComment = function(e) {
    e.preventDefault();
    var nameEl = document.getElementById('comment-name');
    var bodyEl = document.getElementById('comment-body');
    var comment = {
      name: nameEl.value.trim(),
      body: bodyEl.value.trim(),
      time: Date.now()
    };
    var raw = localStorage.getItem(STORAGE_KEY);
    var comments = raw ? JSON.parse(raw) : [];
    comments.unshift(comment);
    saveComments(comments.slice(0, 100));
    bodyEl.value = '';
    nameEl.value = '';
    loadComments();
    return false;
  };
  
  loadComments();
})();
</script>
<!-- END COMMENT WIDGET -->

<script id="report-layout-script">
(function(){
  var body = document.body;
  var buttons = document.querySelectorAll('[data-layout]');
  var LAYOUT_KEY = 'report-layout-pref';
  
  function setLayout(mode) {
    if (mode === 'a4') {
      body.classList.add('report-a4-mode');
      document.documentElement.style.background = '#e8ecf1';
    } else {
      body.classList.remove('report-a4-mode');
      document.documentElement.style.background = '';
    }
    buttons.forEach(function(btn) {
      var active = btn.dataset.layout === mode;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-pressed', String(active));
    });
    localStorage.setItem(LAYOUT_KEY, mode);
  }
  
  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() { setLayout(btn.dataset.layout); });
  });
  
  // Load preference - default wide
  var saved = localStorage.getItem(LAYOUT_KEY) || 'a4';
  setLayout(saved);
})();
</script>
