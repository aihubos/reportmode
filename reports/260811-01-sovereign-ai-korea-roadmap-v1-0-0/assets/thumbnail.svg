<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">소버린 AI, 쉽게 이해하기</title>
<desc id="desc">데이터, 컴퓨팅, 모델, 인재, 운영, 규범의 여섯 층을 추상적으로 표현한 파란색 썸네일</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0E4EAE"/>
    <stop offset="0.58" stop-color="#3182F6"/>
    <stop offset="1" stop-color="#6AA7FF"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#0A326F" flood-opacity="0.28"/>
  </filter>
</defs>
<rect width="1200" height="630" rx="0" fill="url(#bg)"/>
<circle cx="1035" cy="95" r="240" fill="url(#glow)"/>
<circle cx="1030" cy="505" r="330" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
<circle cx="1030" cy="505" r="245" fill="none" stroke="#DFFF6A" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="10 14"/>

<!-- Stack / sovereign shield -->
<g transform="translate(795 115)" filter="url(#shadow)">
  <rect x="42" y="0" width="292" height="360" rx="54" fill="#FFFFFF" fill-opacity="0.94"/>
  <path d="M188 50c45 27 88 32 88 32v75c0 73-42 118-88 141-46-23-88-68-88-141V82s43-5 88-32Z" fill="#E8F3FF" stroke="#3182F6" stroke-width="6"/>
  <path d="m145 167 28 28 58-68" fill="none" stroke="#3182F6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(75 306)">
    <rect width="60" height="17" rx="8.5" fill="#3182F6"/>
    <rect x="72" width="60" height="17" rx="8.5" fill="#6AA7FF"/>
    <rect x="144" width="60" height="17" rx="8.5" fill="#DFFF6A"/>
    <rect x="216" width="42" height="17" rx="8.5" fill="#191F28"/>
  </g>
</g>

<!-- network nodes -->
<g fill="#FFFFFF" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="2">
  <line x1="760" y1="125" x2="690" y2="88"/><line x1="748" y1="278" x2="670" y2="305"/><line x1="790" y1="470" x2="710" y2="535"/>
  <circle cx="690" cy="88" r="12"/><circle cx="670" cy="305" r="12"/><circle cx="710" cy="535" r="12"/>
</g>

<g font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif">
  <text x="84" y="177" fill="#FFFFFF" font-size="78" font-weight="900" letter-spacing="-4">소버린 AI,</text>
  <text x="84" y="273" fill="#FFFFFF" font-size="78" font-weight="900" letter-spacing="-4">쉽게 이해하기</text>
  <rect x="84" y="340" width="410" height="78" rx="24" fill="#DFFF6A"/>
  <text x="112" y="394" fill="#233400" font-size="37" font-weight="900" letter-spacing="-1.5">한국의 2028 로드맵</text>
</g>
</svg>