['vault','1차 자료','Vault는 01 Project 안에<br>AI Builders Lab으로 만듭니다.','', '<div class="grid"><div class="card"><ol class="num"><li>Documents를 엽니다.</li><li>01 Project를 만듭니다.</li><li>안에 AI Builders Lab 폴더를 만듭니다.</li><li>Obsidian에서 이 폴더를 Vault로 엽니다.</li><li>1차~4차 폴더를 만듭니다.</li></ol></div><div class="card blue"><pre class="tree">Documents/\n└── 01 Project/\n    └── AI Builders Lab/\n        ├── 1차/ 2차/ 3차/ 4차/\n        └── my goals.md</pre><p>1차에는 전체 PARA 폴더를 만들지 않습니다.</p></div></div>'+F('Obsidian 왼쪽 파일 탐색기를 봅니다.','위 순서대로 폴더를 만듭니다.','1차~4차 폴더가 보입니다.','Vault 이름과 Finder/탐색기 경로가 같은지 확인합니다.','위치가 헷갈리면 두 위치를 다시 비교합니다.','Obsidian 파일 탐색기, 강조: 1차~4차 폴더')],
['goals','1차 자료','Vault 최상위에<br>my goals.md를 작성합니다.','', '<div class="grid"><div class="card"><ol class="num"><li>Vault 최상위에서 새 노트를 누릅니다.</li><li>my goals.md로 이름을 정합니다.</li><li>아래 네 줄을 내 답으로 채웁니다.</li></ol>'+C('# 나의 AI 활용 목표\n\n- 이름 또는 별칭:\n- 지금 반복해서 하는 일:\n- 2주 뒤 직접 만들고 싶은 결과:\n- 완성됐다고 판단할 수 있는 모습:')+'</div><div class="card blue"><h3>사람이 먼저 쓴 목표</h3><p>AI가 추측해서 작성하지 않습니다. 목표의 사실과 우선순위는 본인이 결정합니다.</p></div></div>'+F('Vault 최상위 파일 목록을 봅니다.','네 항목을 한 줄 이상 채웁니다.','my goals.md 파일 하나가 보입니다.','네 항목을 모두 채웠습니다.','문장이 막히면 키워드만 적고 수업 중 보완합니다.','my goals.md 편집 화면, 강조: Vault 최상위 파일 위치')],
['codex-install','1차 자료','ChatGPT 데스크톱 앱에서<br>Codex 작업 준비를 합니다.','',F('Codex는 ChatGPT 앱 안에서 폴더의 파일 작업을 요청하고 검수하는 도구입니다.','ChatGPT 앱을 설치·로그인하고 Codex에서 AI Builders Lab Vault를 선택합니다.','작업 폴더와 New chat이 보입니다.','작업 위치가 Vault인지 확인합니다.','앱 실패 시 웹 결과를 Obsidian에 수동 복사하고 앱 설치는 미완료로 표시합니다.','Windows ChatGPT 앱, 강조: 좌측 Codex 메뉴와 New chat 버튼')],
['hermes','1차 자료','Hermes와 첫 대화를 하고,<br>직접 다시 실행합니다.','', '<div class="grid"><div class="card"><ol class="num"><li>Hermes를 엽니다.</li><li>내 목표를 확인하는 질문을 입력합니다.</li><li>사실과 표현을 읽고 되묻습니다.</li><li>닫고 다시 열어 새 대화를 시작합니다.</li></ol></div><div class="card blue">'+C('내 my goals.md를 바탕으로 다음 2주 동안 확인할 작은 실행 순서 세 가지를 제안해줘. 모르는 내용은 추측하지 말아줘.')+'</div></div>'+F('Hermes 대화창 입력 칸을 봅니다.','내 목표 기준의 짧은 질문을 입력합니다.','Hermes가 응답합니다.','응답 1회와 재실행 1회를 확인합니다.','모델 연결이 의심되면 hermes model로 돌아갑니다.','Hermes 첫 대화, 강조: 입력 칸과 응답 위치')],
['commands','1차 자료','대화 중 상태를 확인하는<br>네 가지 명령입니다.','', '<div class="grid"><div class="card"><h3>/status</h3><p>현재 세션·연결 상태 확인</p><h3>/model</h3><p>연결된 모델 중 현재 세션의 모델 선택</p></div><div class="card"><h3>/usage</h3><p>토큰 사용량·비용·이용 가능 정보</p><h3>/reasoning</h3><p>추론 강도와 표시 상태 조절</p></div></div>'+F('명령은 Hermes 대화창에 입력합니다. Provider 연결은 hermes model입니다.','먼저 /status를 입력합니다.','상태 정보가 표시됩니다.','명령과 일반 질문의 차이를 설명합니다.','슬래시와 Hermes 입력 위치를 확인합니다.','Hermes에 /status 입력, 강조: 슬래시와 응답')],
['botfather','1차 자료','Telegram에서 BotFather로<br>내 봇을 만듭니다.','',F('Telegram 검색에서 @BotFather를 찾습니다.','1:1에서 /newbot을 입력하고 표시 이름·bot으로 끝나는 사용자명을 정합니다.','봇 생성 후 Token이 한 번 보입니다.','봇 이름과 사용자명만 확인합니다. Token은 공유하지 않습니다.','사용자명이 이미 사용 중이면 다른 단어를 붙입니다.','BotFather /newbot 입력 위치. Token이 보인 화면은 촬영하지 않음')],
['telegram-id','1차 자료','내 숫자 사용자 ID를 확인해<br>나만 봇을 쓰게 합니다.','',F('Gateway는 허용 목록으로 내 계정만 접근하게 설정할 수 있습니다.','공식 문서가 안내하는 ID 확인 봇(예: @userinfobot)과 1:1 대화합니다.','내 숫자 ID를 확인합니다.','숫자 ID를 본인만 볼 수 있게 준비합니다.','문서 절차를 다시 열고 다른 사람 ID와 혼동하지 않습니다.','숫자 사용자 ID 확인 화면, 강조: 실제 숫자는 흐림 처리')],
['gateway','1차 자료','Gateway를 설정하고<br>내 PC에서 시작합니다.','', '<div class="grid"><div class="card"><ol class="num"><li>첫 명령에서 Telegram을 선택합니다.</li><li>Token과 내 숫자 ID를 직접 입력합니다.</li><li>설치·시작·상태 확인을 실행합니다.</li></ol></div><div class="card blue">'+C('hermes gateway setup\nhermes gateway install\nhermes gateway start\nhermes gateway status')+'<p>Windows는 로그인 시 예약 작업, macOS는 launchd 사용자 항목으로 안내될 수 있습니다.</p></div></div>'+F('터미널 Hermes 명령 입력 위치를 봅니다.','네 명령을 순서대로 실행합니다.','Gateway가 연결 준비 또는 실행 상태를 보입니다.','gateway status가 상태를 보여 줍니다.','공식 CLI 우회 → 강사 화면 → 미완료 원인 기록 순서입니다.','hermes gateway status 결과, 강조: 실행 상태와 오류 위치')],
['telegram','1차 자료','Telegram 1:1에서 Hermes에게<br>첫 메시지를 보냅니다.','', '<div class="grid"><div class="card"><ol class="num"><li>내 봇과 1:1 대화를 엽니다.</li><li>먼저 /sethome을 실행합니다.</li><li>연결 확인 메시지를 보냅니다.</li><li>응답을 확인합니다.</li></ol></div><div class="card blue"><h3>/sethome</h3><p>이 대화를 Hermes 홈 채널로 지정합니다. 이후 Cron 결과 수신 대화 지정에도 사용합니다.</p><p>이번 수업은 본인과 봇 1:1만 사용합니다.</p></div></div>'+F('내 Telegram 봇 1:1을 봅니다.','/sethome 뒤 연결 확인 메시지를 보냅니다.','정상 응답이 옵니다.','메시지와 응답을 각각 한 번 확인합니다.','Gateway → ID → Token → Local PC 절전 순서로 확인합니다.','Telegram 1:1에서 /sethome과 응답, 강조: 개인 대화는 흐림 처리')],
['codex','1차 자료','Codex로 Markdown 파일 하나를 만들고<br>사람이 직접 검수합니다.','', '<div class="grid"><div class="card"><ol class="num"><li>Codex에서 Vault를 확인합니다.</li><li>아래 요청을 입력합니다.</li><li>Obsidian에서 한 문장 이상 고칩니다.</li></ol></div><div class="card blue">'+C('AI Builders Lab Vault의 1차 폴더 안에 01-설치-확인.md 파일 하나만 만들어줘. 내가 제공하지 않은 개인 정보나 목표를 추측하지 마. Hermes, Telegram, Obsidian, ChatGPT/Codex 설치 확인 체크 항목만 한국어로 넣어줘.')+'</div></div>'+F('Codex 작업 폴더와 요청 칸을 봅니다.','파일 하나만 만들도록 요청합니다.','1차/01-설치-확인.md 하나가 생성됩니다.','Obsidian에서 사실·표현을 직접 고칩니다.','다른 파일을 제안하면 실행 전 “파일 하나만”을 다시 요청합니다.','Codex Vault 선택과 요청 입력, 강조: 작업 폴더와 요청 칸')+'<a class="next" href="#replay">후속 참고 건너뛰고 완료 확인</a>'],
['cron-overview','후속 참고','수동 명령과 예약 자동화는<br>다른 방식으로 움직입니다.','',R+'<div class="grid"><div class="card"><h3>수동 실행</h3><p>내가 Telegram 또는 Hermes에서 요청할 때 실행합니다.</p></div><div class="card blue"><h3>Cron</h3><p>정한 시간에 새 세션으로 실행합니다. 기존 대화를 자동으로 기억한다고 가정하지 않습니다.</p></div></div><p class="tag">먼저 Telegram 1:1에서 /sethome을 실행합니다. Gateway가 실행 중이어야 하며 비용이 발생할 수 있습니다.</p>'],
['cron-practice','후속 참고','예약 자동화는 목적과 비용을<br>검수한 뒤 만듭니다.','',R+'<div class="card blue">'+C('/cron add "0 8 * * *" "오늘의 일정과 AI 뉴스 3개를 확인하고 출처 링크와 함께 짧게 정리해 Telegram으로 보내줘."\n/cron list\n/cron run <job_id>')+'<p>터미널 대체: hermes cron list · hermes cron run &lt;job_id&gt; · hermes cron status</p></div>'+F('/cron add는 예약 작업을 추가하고 목록·1회 실행으로 점검합니다.','2차에서만 실제 등록합니다.','등록·목록·1회 실행 순서를 이해합니다.','1차 완료 기준이 아님을 확인합니다.','응답이 없으면 Gateway와 /sethome부터 확인합니다.','Cron 목록·1회 실행 결과, 강조: job_id 위치')],
['second-brain','후속 참고','1차 Vault에서 시작해<br>나중에 지식 구조로 확장합니다.','',R+'<div class="grid"><div class="card blue"><h3>1차 실제 구조</h3><pre class="tree">Documents/01 Project/\n└── AI Builders Lab/\n    ├── 1차 ~ 4차\n    └── my goals.md</pre></div><div class="card"><h3>후속 PARA 예시</h3><pre class="tree">00 Inbox\n01 Project\n02 Area\n03 Resource\n04 Archive\n05 LLM Wiki</pre></div></div><p class="tag">1차에서는 전체 PARA 폴더를 만들지 않습니다.</p>'],
['llm-wiki','후속 참고','LLM Wiki는 자료를 그대로 쌓지 않고<br>읽을 수 있게 정리하는 흐름입니다.','',R+'<div class="course"><div><b>raw</b>원문·메모·링크</div><div><b>entities</b>사람·회사·도구</div><div><b>concepts</b>관계와 개념</div><div><b>검수</b>출처와 표현</div></div><p class="tag">raw·entities·concepts는 2차에 정할 예시 구조이며 사용자의 로컬 지식 저장소를 기준으로 합니다.</p>'],
['expansion','후속 참고','연결은 한 번에 모두 쓰지 않고,<br>필요할 때 한 가지씩 확장합니다.','',R+'<div class="course"><div><b>채널</b>Telegram 실제 · Discord/Slack 예시</div><div><b>모델</b>GPT 실제 · Claude/Gemini 예시</div><div><b>위치</b>Local PC 실제 · VPS 추후 선택</div><div><b>원칙</b>동시에 모두 필수 아님</div></div><p class="tag">연결을 추가할 때마다 권한·비용·개인정보·실제 필요성을 검수합니다.</p>'],
['replay','마무리','수업 뒤에는 이 여섯 단계로<br>혼자 다시 실행합니다.','', '<div class="grid"><div class="card"><ol class="num"><li>Obsidian에서 my goals.md 열기</li><li>Hermes 실행·응답 받기</li><li>hermes gateway status 확인</li><li>Telegram 봇 1:1에 메시지</li><li>Codex로 한 파일 만들기</li><li>Obsidian에서 한 문장 수정</li></ol></div><div class="card blue"><h3>막히면 기록할 것</h3><p>어느 단계에서 어떤 화면·문구가 보였는지만 짧게 적습니다. 비밀정보는 적지 않습니다.</p></div></div><div class="check"><input id="r1" data-check type="checkbox"><label for="r1">자료만 보고 여섯 단계를 설명할 수 있다.</label></div>'],

<script>
(() => {
  const key = "ai-builders-lab-session-01-access";
  const expected = "3f44b2fbb0aaffb68530a82cd4e4da9498b9337ae9c805b600efff12624c2cc7";
  const form = document.getElementById("access-gate-form");
  const input = document.getElementById("access-password");
  const error = document.getElementById("access-error");
  const grant = () => {
    document.body.classList.add("access-granted");
    sessionStorage.setItem(key, "granted");
    input.value = "";
  };
  if (sessionStorage.getItem(key) === "granted") grant();
  form.addEventListener("submit", async event => {
    event.preventDefault();
    error.textContent = "";
    if (!window.crypto || !window.crypto.subtle) {
      error.textContent = "이 브라우저에서는 비밀번호 확인을 할 수 없습니다.";
      return;
    }
    const bytes = new TextEncoder().encode(input.value);
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    const actual = Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, "0")).join("");
    if (actual === expected) {
      grant();
      return;
    }
    input.value = "";
    input.focus();
    error.textContent = "비밀번호를 다시 확인해 주세요.";
  });
})();
</script>
