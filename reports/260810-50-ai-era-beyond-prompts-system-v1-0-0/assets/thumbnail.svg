<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">AI 시대, 프롬프트가 답이 아니다</title>
<desc id="desc">학습, 검증, 축적, 실행이 하나의 시스템으로 연결되는 모습을 표현한 Report Hub 썸네일</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FAFF"/>
    <stop offset="0.55" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#EEF5FF"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1B64DA"/>
    <stop offset="1" stop-color="#5A9CFF"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#191F28" flood-opacity="0.12"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3182F6" flood-opacity="0.20"/>
  </filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1115" cy="45" r="215" fill="#3182F6" opacity="0.07"/>
<circle cx="70" cy="610" r="240" fill="#DFFF6A" opacity="0.14"/>
<path d="M66 106h172" stroke="#3182F6" stroke-width="8" stroke-linecap="round"/>
<text x="66" y="78" fill="#3182F6" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="26" font-weight="800" letter-spacing="1">REPORT HUB · AIHUBOS</text>

<g font-family="Noto Sans CJK KR, NanumSquare, sans-serif" fill="#191F28">
  <text x="66" y="202" font-size="66" font-weight="900" letter-spacing="-3">AI 시대,</text>
  <text x="66" y="286" font-size="76" font-weight="900" letter-spacing="-4">프롬프트가</text>
  <rect x="58" y="309" width="378" height="36" rx="12" fill="#DFFF6A" transform="rotate(-1 58 309)"/>
  <text x="66" y="365" font-size="76" font-weight="900" letter-spacing="-4">답이 아니다</text>
  <text x="70" y="425" font-size="30" font-weight="750" fill="#6B7684">남는 것은 시스템</text>
</g>

<g transform="translate(760 315)" filter="url(#shadow)">
  <circle r="176" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="2"/>
  <circle r="126" fill="none" stroke="#3182F6" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="9 11"/>
  <path d="M0-126V-70M126 0H70M0 126V70M-126 0H-70" stroke="#3182F6" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <circle r="70" fill="url(#blue)" filter="url(#soft)"/>
  <text x="0" y="-6" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="18" font-weight="800" letter-spacing="2">PERSONAL</text>
  <text x="0" y="25" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="26" font-weight="900">SYSTEM</text>

  <g font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="23" font-weight="900" text-anchor="middle">
    <g transform="translate(0 -144)"><rect x="-61" y="-29" width="122" height="58" rx="20" fill="#E8F3FF" stroke="#C9E0FF"/><text y="8" fill="#1B64DA">학습</text></g>
    <g transform="translate(144 0)"><rect x="-61" y="-29" width="122" height="58" rx="20" fill="#EEE9FF" stroke="#DDD3FF"/><text y="8" fill="#6C52CC">검증</text></g>
    <g transform="translate(0 144)"><rect x="-61" y="-29" width="122" height="58" rx="20" fill="#DFFBF2" stroke="#BDEEDF"/><text y="8" fill="#08745A">축적</text></g>
    <g transform="translate(-144 0)"><rect x="-61" y="-29" width="122" height="58" rx="20" fill="#F3F9C9" stroke="#DFFF6A"/><text y="8" fill="#536A00">실행</text></g>
  </g>
</g>

<g font-family="Noto Sans CJK KR, NanumSquare, sans-serif">
  <rect x="66" y="510" width="440" height="64" rx="22" fill="#191F28"/>
  <text x="94" y="551" fill="#FFFFFF" font-size="24" font-weight="800">학습 → 검증 → 축적 → 실행</text>
  <text x="1115" y="572" text-anchor="end" fill="#8B95A1" font-size="21" font-weight="700">Jeremy Lee · 2026</text>
</g>
</svg>