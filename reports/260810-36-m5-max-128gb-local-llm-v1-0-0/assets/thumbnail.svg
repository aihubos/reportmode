      <rect x="47" y="0" width="36" height="14" rx="7" fill="#5CA2FF"/>
      <rect x="94" y="0" width="36" height="14" rx="7" fill="#87BCFF"/>
      <rect x="141" y="0" width="36" height="14" rx="7" fill="#DFFF6A"/>
      <rect x="188" y="0" width="36" height="14" rx="7" fill="#DFFF6A" opacity="0.56"/>
      <rect x="235" y="0" width="36" height="14" rx="7" fill="#55606F"/>
    </g>
    <path d="M-24 328h432l-36 48H12z" fill="#DDE3EA"/>
