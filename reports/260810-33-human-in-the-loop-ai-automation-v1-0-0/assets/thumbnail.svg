<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">사람이 남아야 할 3곳</title>
<desc id="desc">AI 자동화 승인 경계를 세 개의 게이트로 표현한 Report Hub 썸네일</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.58" stop-color="#f4f8ff"/>
    <stop offset="1" stop-color="#eef4ff"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#1b64da"/>
    <stop offset="1" stop-color="#3182f6"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#192f55" flood-opacity="0.15"/>
  </filter>
  <style>
    .ko { font-family: 'Noto Sans CJK KR','NanumSquare','Apple SD Gothic Neo',sans-serif; }
  </style>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1080" cy="90" r="210" fill="#3182f6" opacity="0.08"/>
<circle cx="100" cy="560" r="240" fill="#dfff6a" opacity="0.15"/>
<path d="M0 510 C220 430 400 590 620 500 C830 414 1000 460 1200 360 L1200 630 L0 630 Z" fill="#ffffff" opacity="0.72"/>

<!-- Main text -->
<text x="72" y="245" class="ko" font-size="69" font-weight="900" fill="#191f28" letter-spacing="-4">사람이 남아야 할</text>
<text x="72" y="338" class="ko" font-size="92" font-weight="900" fill="#3182f6" letter-spacing="-5">3곳</text>
<rect x="72" y="375" width="332" height="58" rx="18" fill="#dfff6a"/>
<text x="96" y="415" class="ko" font-size="28" font-weight="850" fill="#2f3c00" letter-spacing="-1.4">AI 자동화 승인 경계</text>

<!-- Three gates diagram -->
<g transform="translate(655 92)" filter="url(#shadow)">
