<text x="72" y="218" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="68" font-weight="800" letter-spacing="-4" fill="#191F28">
  <tspan x="72" dy="0">검색보다 판단의</tspan>
  <tspan x="72" dy="84">이력을 남겨라</tspan>
</text>
