<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">검색보다 판단의 이력을 남겨라</title>
<desc id="desc">왼쪽의 검색 노드와 오른쪽의 버전이 누적되는 위키 페이지를 대비한 Report Hub 썸네일</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.62" stop-color="#f4f8ff"/>
    <stop offset="1" stop-color="#e8f3ff"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1B64DA"/>
    <stop offset="1" stop-color="#5A9CFF"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#191F28" flood-opacity="0.13"/>
  </filter>
</defs>
<rect width="1200" height="630" rx="0" fill="url(#bg)"/>
<circle cx="1110" cy="76" r="180" fill="#3182F6" opacity="0.08"/>
<circle cx="82" cy="570" r="180" fill="#DFFF6A" opacity="0.16"/>
<rect x="72" y="70" width="52" height="52" rx="17" fill="url(#blue)"/>
