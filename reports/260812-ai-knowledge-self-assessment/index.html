      background-size: cover;
      filter: blur(30px) saturate(.9);
      opacity: .48;
      transform: scale(1.12);
      content: "";
    }
    .slide-shell::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, transparent 0, rgba(4, 7, 12, .2) 44%, rgba(4, 7, 12, .92) 100%);

  <script>
    (() => {
      "use strict";

      const slides = [
        { src: "assets/level-01-beginner-word-cloud.png", stage: "초급", type: "워드클라우드", alt: "초급 단계의 AI 관련 핵심 용어 워드클라우드", note: "이미지를 천천히 살펴보고, 낯선 용어가 얼마나 있는지 확인해 보세요." },
        { src: "assets/level-01-beginner-term-table.png", stage: "초급", type: "용어표", alt: "초급 단계 AI 용어 설명 표", note: "워드클라우드에서 본 용어의 뜻을 한 번씩 확인해 보세요." },
        { src: "assets/level-02-intermediate-word-cloud.png", stage: "중급", type: "워드클라우드", alt: "중급 단계의 AI 관련 핵심 용어 워드클라우드", note: "업무에서 자주 만나는 개념이 어느 정도인지 점검해 보세요." },
        { src: "assets/level-02-intermediate-term-table.png", stage: "중급", type: "용어표", alt: "중급 단계 AI 용어 설명 표", note: "용어를 알고 있는지보다, 내 말로 설명할 수 있는지를 기준으로 보세요." },
        { src: "assets/level-03-advanced-word-cloud.png", stage: "심화", type: "워드클라우드", alt: "심화 단계의 AI 관련 핵심 용어 워드클라우드", note: "모델·데이터·시스템의 연결 관계가 보이기 시작하는 단계입니다." },
        { src: "assets/level-03-advanced-term-table.png", stage: "심화", type: "용어표", alt: "심화 단계 AI 용어 설명 표", note: "각 개념이 실제 제품과 업무 흐름에서 어디에 쓰이는지 떠올려 보세요." },
        { src: "assets/level-04-expert-word-cloud.png", stage: "전문가", type: "워드클라우드", alt: "전문가 단계의 AI 관련 핵심 용어 워드클라우드", note: "기술 선택의 장단점과 운영 조건을 판단할 수 있는지 점검해 보세요." },
        { src: "assets/level-04-expert-term-table.png", stage: "전문가", type: "용어표", alt: "전문가 단계 AI 용어 설명 표", note: "같은 용어라도 조직의 목적과 제약에 따라 판단이 달라질 수 있습니다." },
        { src: "assets/level-05-frontier-word-cloud.png", stage: "연구·최전선", type: "워드클라우드", alt: "연구와 최전선 단계의 AI 관련 핵심 용어 워드클라우드", note: "새로운 기술의 가능성과 한계를 함께 읽는 단계입니다." },
        { src: "assets/level-05-frontier-term-table.png", stage: "연구·최전선", type: "용어표", alt: "연구와 최전선 단계 AI 용어 설명 표", note: "모르는 용어가 많아도 괜찮습니다. 다음에 탐색할 주제를 찾는 자료로 활용해 보세요." }
      ];

      const shell = document.getElementById("aiKnowledgeSlideshow");
      const stage = document.getElementById("slideStage");
      const image = document.getElementById("slideImage");
      const label = document.getElementById("slideStageLabel");
      const note = document.getElementById("slideStageNote");
      const number = document.getElementById("slideNumber");
      const total = document.getElementById("slideTotal");
      const progress = document.getElementById("slideProgress");
      const status = document.getElementById("slideStatus");
      const previous = document.getElementById("slidePrev");
      const next = document.getElementById("slideNext");
      let current = 0;
      let transitionToken = 0;
      let touchStartX = null;
      let touchStartY = null;

      total.textContent = String(slides.length);
      slides.forEach((slide, index) => {
        const page = document.createElement("button");
        page.className = "slide-page-button";
        page.type = "button";
        page.setAttribute("role", "tab");
        page.setAttribute("aria-label", `${index + 1}번: ${slide.stage} ${slide.type}`);
        page.addEventListener("click", () => setSlide(index));
        progress.appendChild(page);
      });
      const pages = [...progress.querySelectorAll(".slide-page-button")];

      slides.forEach((slide) => {
        const preload = new Image();
        preload.src = slide.src;
      });

      function formatNumber(value) {
        return String(value + 1).padStart(2, "0");
      }

      function setSlide(index) {
        const nextIndex = Math.max(0, Math.min(slides.length - 1, index));
        if (nextIndex === current && image.getAttribute("src") === slides[nextIndex].src) return;
        const slide = slides[nextIndex];
        const token = ++transitionToken;
        image.classList.add("is-changing");
        window.setTimeout(() => {
          if (token !== transitionToken) return;
          current = nextIndex;
          image.src = slide.src;
          image.alt = slide.alt;
          shell.style.setProperty("--slide-background", `url("${slide.src}")`);
          label.textContent = `${slide.stage} · ${slide.type}`;
          note.textContent = slide.note;
          number.textContent = formatNumber(current);
          previous.disabled = current === 0;
          next.disabled = current === slides.length - 1;
          pages.forEach((page, pageIndex) => {
            const active = pageIndex === current;
            page.setAttribute("aria-current", String(active));
            page.setAttribute("aria-selected", String(active));
            page.tabIndex = active ? 0 : -1;
          });
          status.textContent = `${current + 1} / ${slides.length}. ${slide.stage} ${slide.type}`;
          image.classList.remove("is-changing");
        }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 120);
      }

      previous.addEventListener("click", () => setSlide(current - 1));
      next.addEventListener("click", () => setSlide(current + 1));

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (target && /^(INPUT|TEXTAREA|SELECT)$/i.test(target.tagName)) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          setSlide(current - 1);
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          setSlide(current + 1);
        }
      });

      stage.addEventListener("pointerdown", (event) => {
        touchStartX = event.clientX;
        touchStartY = event.clientY;
      });
      stage.addEventListener("pointerup", (event) => {
        if (touchStartX === null || touchStartY === null) return;
        const deltaX = event.clientX - touchStartX;
        const deltaY = event.clientY - touchStartY;
        touchStartX = null;
        touchStartY = null;
        if (Math.abs(deltaX) < 48 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
        setSlide(current + (deltaX < 0 ? 1 : -1));
      });
      stage.addEventListener("pointercancel", () => { touchStartX = null; touchStartY = null; });

      shell.style.setProperty("--slide-background", `url("${slides[0].src}")`);
      current = -1;
      setSlide(0);
    })();
  </script>
