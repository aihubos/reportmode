<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">넨 육계통 관계도</title><desc id="desc">강화, 변화, 방출, 조작, 구현화, 특질의 여섯 계통을 육각형으로 표시</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3182F6"/><stop offset="1" stop-color="#1B64DA"/></linearGradient></defs>
<rect width="1200" height="760" rx="60" fill="#F7F8FA"/>
<path d="M600 90 900 255 900 505 600 670 300 505 300 255Z" fill="#fff" stroke="#DCE8F7" stroke-width="12"/>
<path d="M600 170 810 285 810 475 600 590 390 475 390 285Z" fill="none" stroke="#B8D7FF" stroke-width="8" stroke-dasharray="18 18"/>
<circle cx="600" cy="380" r="120" fill="url(#g)"/><text x="600" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#CFE4FF">HATSU</text><text x="600" y="415" text-anchor="middle" font-family="system-ui,sans-serif" font-size="48" font-weight="900" fill="#fff">개인의 규칙</text>
<g font-family="system-ui,sans-serif" text-anchor="middle"><g transform="translate(600 90)"><circle r="74" fill="#DFFBF2"/><text y="10" font-size="34" font-weight="900" fill="#11745F">강화</text></g><g transform="translate(900 255)"><circle r="74" fill="#EEE9FF"/><text y="10" font-size="34" font-weight="900" fill="#6E53CF">변화</text></g><g transform="translate(900 505)"><circle r="74" fill="#E8F3FF"/><text y="10" font-size="34" font-weight="900" fill="#1B64DA">방출</text></g><g transform="translate(600 670)"><circle r="74" fill="#FFF4C2"/><text y="10" font-size="34" font-weight="900" fill="#946D00">조작</text></g><g transform="translate(300 505)"><circle r="74" fill="#FFE7EA"/><text y="10" font-size="34" font-weight="900" fill="#B63B4A">구현화</text></g><g transform="translate(300 255)"><circle r="74" fill="#191F28"/><text y="10" font-size="34" font-weight="900" fill="#fff">특질</text></g></g>
<text x="600" y="735" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#6B7684">인접 계통은 비교적 익히기 쉽고, 멀어질수록 효율이 낮아진다 · 특질은 예외적</text>
</svg>
