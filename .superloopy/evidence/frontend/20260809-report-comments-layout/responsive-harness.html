<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Report Hub responsive QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #dfe3e8; }
    body { display: grid; place-items: start center; padding: 16px; }
    iframe { display: block; border: 0; background: #fff; box-shadow: 0 8px 24px rgba(25,31,40,.12); }
  </style>
</head>
<body>
  <iframe id="qaFrame" title="반응형 검수 화면"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const frame = document.getElementById("qaFrame");
    frame.style.width = `${Math.max(320, Number(params.get("width")) || 390)}px`;
    frame.style.height = `${Math.max(640, Number(params.get("height")) || 844)}px`;
    frame.src = params.get("path") || "/archive/";
  </script>
</body>
</html>
