# Server-side nginx snippet (lives in /opt/aibuilderslab/nginx.conf on the VPS, inside the
# aibuilderslab.kr server block). /opt/reporthub/current is mounted read-only at /srv/reporthub.
    # --- Report Hub (moved from GitHub Pages) ---
    location = /reporthub { return 301 /reporthub/; }
    location ^~ /reporthub/ {
        alias /srv/reporthub/;
        index index.html;
        try_files $uri $uri/ =404;
        expires 5m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # --- end Report Hub ---
