<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jeremy를 위한 검증 가능한 웹 보고서 아카이브">
  <title>Report Mode — Web Reports</title>
  <style>
    :root{--ink:#1d1d1f;--muted:#6e6e73;--bg:#f5f5f7;--card:#fff;--blue:#0066cc}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.02em}.wrap{max-width:980px;margin:auto;padding:88px 24px}.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}h1{font-size:clamp(48px,8vw,82px);line-height:1;letter-spacing:-.055em;margin:18px 0 22px}header p{max-width:650px;font-size:21px;line-height:1.45;color:var(--muted)}.list{margin-top:64px}.card{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:var(--card);border-radius:18px;padding:30px;text-decoration:none;color:inherit;min-height:150px;box-shadow:0 12px 40px rgba(0,0,0,.05);transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translateY(-3px);box-shadow:0 18px 46px rgba(0,0,0,.09)}.card:focus-visible{outline:3px solid #0071e3;outline-offset:4px}.tag{font-size:13px;color:#9a6700;font-weight:700}.card h2{font-size:28px;margin:8px 0}.card p{color:var(--muted);margin:0;line-height:1.5}.arrow{font-size:32px;color:var(--blue)}footer{margin-top:72px;padding-top:24px;border-top:1px solid #d2d2d7;color:var(--muted);font-size:13px}@media(max-width:620px){.wrap{padding:64px 20px}.card{grid-template-columns:1fr}.arrow{display:none}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
<body><main class="wrap"><header><div class="eyebrow">GitHub Pages Report Archive</div><h1>Report<br>Mode.</h1><p>원자료를 조사하고, 사실과 해석을 분리해, 공유 가능한 웹페이지로 발행한 보고서 모음입니다.</p></header><section class="list" aria-label="보고서 목록"><a class="card" href="reports/apple-foldable-iphone/"><div><div class="tag">미발표 제품 · 루머 분석</div><h2>Apple 폴더블 iPhone</h2><p>예상 사양, 장점과 단점, 구매 전 확인해야 할 다섯 가지 기준</p></div><span class="arrow" aria-hidden="true">→</span></a></section><footer>Report Mode · 최종 판단과 검수는 사용자에게 있습니다.</footer></main></body>
</html>
