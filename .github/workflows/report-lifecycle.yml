name: Process Report Lifecycle

on:
  repository_dispatch:
    types: [report-lifecycle]

concurrency:
  group: report-lifecycle-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process lifecycle job
        env:
          REPORT_LIFECYCLE_JOB_ID: ${{ github.event.client_payload.jobId }}
          REPORT_LIFECYCLE_WORKER_SECRET: ${{ secrets.REPORT_LIFECYCLE_WORKER_SECRET }}
        run: node scripts/report-lifecycle.mjs
